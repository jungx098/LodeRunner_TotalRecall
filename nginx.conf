server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index lodeRunner.html;

    # No types block here on purpose: declaring one inside `server` replaces
    # the mime.types map inherited from http rather than extending it, which
    # would serve every .js and .png as application/octet-stream.  The image
    # already includes mime.types, which covers html/js/png/gif/ico/ogg/mp3 --
    # everything the game requests except the two .cur cursor files, and those
    # work fine as octet-stream.

    # The game appends a ?version query to asset URLs, so a stale theme PNG
    # would otherwise survive a rebuild and quietly misrepresent a change.
    add_header Cache-Control "no-store";
    etag off;

    location = / {
        return 302 /lodeRunner.html;
    }

    # The dev bind mount is the whole repo, so .git would otherwise be
    # reachable over HTTP.
    location ~ /\. {
        deny all;
    }
}
