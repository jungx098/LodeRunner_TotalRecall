services:
  loderunner:
    build: .
    image: loderunner-totalrecall
    container_name: loderunner

    # Published on every interface so the game is reachable by hostname from
    # the network and not just from the machine running it.  Change to
    # "127.0.0.1:8080:80" to make it local-only again.
    ports:
      - "8080:80"

    # The repo is mounted over the image's copy so edits to a theme PNG or a
    # .js file show up on reload, with no rebuild.  Drop this block to serve
    # the baked-in copy instead.
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped
